# Reglas de detekt para APhid. Se parte de la configuración por defecto.
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 150
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 25
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    active: false
  LargeClass:
    threshold: 800
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 8

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  ConstructorParameterNaming:
    active: false
  VariableNaming:
    active: false
  MatchingDeclarationName:
    active: false
  EnumNaming:
    active: false
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 180
    excludes: ['**/icon/AphidIcons.kt']
  ReturnCount:
    max: 8
    excludeGuardClauses: true
  WildcardImport:
    active: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 5
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  UseCheckOrError:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
