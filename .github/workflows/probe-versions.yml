name: Probe APIs
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-versions.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AAR APIs
        run: |
          G=https://dl.google.com/dl/android/maven2
          mkdir w && cd w
          get() { curl -sfL "$G/$1" -o "$2"; }
          get com/google/mlkit/genai-prompt/1.0.0-beta4/genai-prompt-1.0.0-beta4.aar prompt.aar
          get com/google/mlkit/genai-common/1.0.0-beta4/genai-common-1.0.0-beta4.aar common.aar
          get com/google/ai/edge/litert/litert/2.3.0/litert-2.3.0.aar litert.aar
          get com/google/ai/edge/litert/litert-api/2.3.0/litert-api-2.3.0.aar litertapi.aar || true
          curl -sfL "$G/com/google/ai/edge/litert/litert/2.3.0/litert-2.3.0.pom" | grep -B1 -A2 artifactId | head -30
          get com/android/billingclient/billing/9.1.0/billing-9.1.0.aar billing.aar
          for a in prompt common litert litertapi billing; do
            [ -f $a.aar ] || continue
            mkdir $a && (cd $a && unzip -q ../$a.aar && unzip -q -o classes.jar -d cls 2>/dev/null)
          done
          jp() { (cd $1/cls && javap -cp . "$2" 2>&1 | head -${3:-50}); }
          for c in GenerativeModel Generation GenerateContentResponse Candidate GenerateContentRequest GenerateContentRequestKt TextPart GenerationConfig; do jp prompt com.google.mlkit.genai.prompt.$c; done
          (cd common/cls && find . -name '*.class' | grep -v '\$' | grep -viE '/zz' | head -30)
          jp common com.google.mlkit.genai.common.FeatureStatus
          jp common com.google.mlkit.genai.common.DownloadStatus 20
          jp common com.google.mlkit.genai.common.GenAiException 20
          jp litert org.tensorflow.lite.Interpreter 60
          [ -d litertapi ] && (cd litertapi/cls && find . -name '*.class' | grep -v '\$' | head -30) && jp litertapi org.tensorflow.lite.InterpreterApi 60
          jp billing com.android.billingclient.api.BillingClient 80
          jp billing 'com.android.billingclient.api.BillingClient$Builder' 30
          jp billing com.android.billingclient.api.PendingPurchasesParams 20
          jp billing 'com.android.billingclient.api.PendingPurchasesParams$Builder' 20
          jp billing com.android.billingclient.api.QueryProductDetailsResult 20
          jp billing 'com.android.billingclient.api.QueryProductDetailsParams$Product$Builder' 20
          jp billing 'com.android.billingclient.api.BillingFlowParams$ProductDetailsParams$Builder' 20
          jp billing com.android.billingclient.api.ProductDetailsResponseListener 10
          jp billing com.android.billingclient.api.ProductDetails 40
