name: Probe APIs
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-versions.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AAR APIs
        run: |
          G=https://dl.google.com/dl/android/maven2
          mkdir w && cd w
          get() { curl -sfL "$G/$1" -o "$2"; }
          get com/google/mlkit/genai-prompt/1.0.0-beta4/genai-prompt-1.0.0-beta4.aar prompt.aar
          get com/google/mlkit/genai-common/maven-metadata.xml gc.xml; grep -oE '<version>[^<]+' gc.xml | tail -3
          get com/google/ai/edge/litert/litert/2.3.0/litert-2.3.0.aar litert.aar
          get com/android/billingclient/billing/9.1.0/billing-9.1.0.aar billing.aar
          curl -sfL "$G/com/google/mlkit/genai-prompt/1.0.0-beta4/genai-prompt-1.0.0-beta4.pom" | grep -A3 artifactId | head -40
          for a in prompt litert billing; do
            mkdir $a && (cd $a && unzip -q ../$a.aar && unzip -q -o classes.jar -d cls 2>/dev/null)
            echo "=== $a classes"; (cd $a/cls && find . -name '*.class' | grep -v '\$' | grep -viE 'internal|zz|/a/|/b/' | head -80)
          done
          cd prompt/cls && for c in $(find . -name '*.class' | grep -v '\$' | grep -E 'genai/prompt/[A-Za-z]+\.class$'); do javap -cp . ${c%.class} | head -40; done
          cd ../../litert/cls && for c in $(find . -name 'Interpreter.class' -o -name 'CompiledModel.class' -o -name 'TensorBuffer.class' | head -5); do javap -cp . ${c%.class} | head -60; done
