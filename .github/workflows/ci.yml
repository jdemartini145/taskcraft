name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, pruebas y lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar que no haya claves de API
        run: |
          if grep -RInE "sk-ant-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{30,}" --exclude-dir=.git --exclude-dir=build . ; then
            echo "Se encontró algo parecido a una clave de API"; exit 1
          fi

      - name: Compilar (debug) y pruebas unitarias
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --continue --console=plain 2>&1 | tee build.log

      - name: Análisis estático (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck --continue

      - name: Lint de Android
        run: |
          set -o pipefail
          ./gradlew lintDebug --continue --console=plain 2>&1 | tee lint.log

      - name: Build release (R8)
        run: ./gradlew assembleRelease

      - name: Resumen de errores
        if: failure()
        run: |
          for f in build.log lint.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -nE "^e: |^w: .*error|error:|ERROR|What went wrong|> Task .* FAILED|FAILED$|Exception:|tests completed|Unresolved|There were failing tests" "$f" | grep -v "^\s*at " | head -250
          done
          for x in $(find . -path "*/build/test-results/*" -name "*.xml"); do
            grep -l "<failure" "$x" >/dev/null 2>&1 && { echo "== $x"; grep -A3 "<failure" "$x" | head -15; }
          done | head -150

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
